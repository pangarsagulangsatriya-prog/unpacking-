name: Sync UNPACKING Landscape Data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sync_landscapes.py"
      - ".github/workflows/sync-landscapes.yml"
  schedule:
    - cron: "0 2 * * 1"
concurrency:
  group: landscape-acquisition
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free scientific libraries
        run: pip install requests rasterio numpy pillow
      - name: Download public landscape data and build HTML
        run: |
          python sync_landscapes.py
          python embed_snapshot.py
      - name: Commit acquired public data and atlas
        run: |
          git config user.name "unpacking-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if ! git diff --cached --quiet; then
            git commit -m "Update public landscape datasets and satellite previews"
            git pull --rebase -X theirs origin main
            git push
          fi
      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unpacking-acquisition-report
          path: docs/data-status.json
          if-no-files-found: warn
